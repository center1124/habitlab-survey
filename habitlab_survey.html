<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3분 대사 자가진단 — THE HABIT LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-dark: #1E3A5F;
    --blue-mid: #2E6DAD;
    --blue-accent: #4A90D9;
    --blue-light: #EEF5FC;
    --pink: #FF7B9A;
    --pink-light: #FFF0F3;
    --white: #FFFFFF;
    --gray-100: #F8F9FC;
    --gray-300: #DDE3ED;
    --gray-500: #7A8899;
    --gray-700: #3D4F63;
    --font-display: 'DM Sans', sans-serif;
    --font-body: 'Noto Sans KR', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--gray-100);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 480px;
    background: var(--white);
    border-radius: 24px;
    box-shadow: 0 8px 40px rgba(10,35,66,0.12);
    overflow: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1E3A5F 0%, #2E6DAD 100%);
    padding: 28px 28px 24px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 150px; height: 150px;
    border-radius: 50%;
    background: rgba(255,123,154,0.12);
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: -20px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .brand {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.3;
  }

  /* Progress */
  .progress-wrap {
    padding: 16px 28px 0;
    display: none;
  }
  .progress-wrap.visible { display: block; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--gray-500);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .progress-bar {
    height: 4px;
    background: var(--gray-300);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), #FFB3C6);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* Screen */
  .screen { display: none; padding: 28px; }
  .screen.active { display: block; }

  /* Start screen */
  .subtitle {
    font-size: 15px;
    color: var(--gray-500);
    line-height: 1.7;
    margin-bottom: 32px;
  }
  .disclaimer {
    font-size: 11px;
    color: var(--gray-500);
    line-height: 1.6;
    padding-top: 20px;
    border-top: 1px solid var(--gray-100);
    margin-top: 8px;
  }

  /* Buttons */
  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--pink), #FF9BB5);
    color: var(--white);
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(255,123,154,0.30);
    letter-spacing: 0.3px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,123,154,0.40); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-back {
    background: none;
    border: none;
    color: var(--gray-500);
    font-size: 13px;
    font-family: var(--font-body);
    cursor: pointer;
    padding: 8px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 20px;
  }
  .btn-back:hover { color: var(--blue-accent); }

  /* Consent */
  .consent-label {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    padding: 16px;
    border: 1.5px solid var(--gray-300);
    border-radius: 12px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  .consent-label:has(input:checked) { border-color: var(--pink); background: var(--pink-light); }
  .consent-label input { display: none; }
  .checkbox-custom {
    width: 20px; height: 20px;
    min-width: 20px;
    border: 2px solid var(--gray-300);
    border-radius: 6px;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    background: var(--white);
  }
  .consent-label:has(input:checked) .checkbox-custom {
    background: var(--pink);
    border-color: var(--pink);
  }
  .checkbox-custom::after {
    content: '✓';
    font-size: 12px;
    color: white;
    display: none;
    font-weight: 700;
  }
  .consent-label:has(input:checked) .checkbox-custom::after { display: block; }
  .consent-text { font-size: 14px; color: var(--gray-700); line-height: 1.6; }
  .consent-detail { font-size: 12px; color: var(--gray-500); margin-top: 6px; line-height: 1.5; }

  /* Form inputs */
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 500; color: var(--gray-700); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--gray-300);
    border-radius: 12px;
    font-size: 15px;
    font-family: var(--font-body);
    color: var(--gray-700);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--pink); }

  /* Question */
  .question-part {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--pink);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .question-text {
    font-size: 17px;
    font-weight: 500;
    color: var(--blue-dark);
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--gray-300);
    border-radius: 12px;
    background: var(--white);
    font-size: 14px;
    font-family: var(--font-body);
    color: var(--gray-700);
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    line-height: 1.5;
  }
  .option-btn:hover { border-color: var(--pink); background: var(--pink-light); color: var(--blue-dark); }
  .option-btn.selected { border-color: var(--pink); background: var(--pink); color: white; }

  /* Text input for Q1 */
  .year-input-wrap { margin-bottom: 24px; }

  /* Result screen */
  .result-level {
    text-align: center;
    padding: 28px 0 20px;
  }
  .level-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .level-name {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--blue-dark);
    margin-bottom: 4px;
  }
  .level-en {
    font-size: 13px;
    color: var(--gray-500);
    margin-bottom: 12px;
    font-family: var(--font-display);
    letter-spacing: 0.5px;
  }
  .result-summary {
    font-size: 15px;
    font-weight: 500;
    color: var(--gray-700);
    line-height: 1.6;
    padding: 0 8px;
  }
  .score-circle {
    width: 90px; height: 90px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .score-number {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }
  .score-label { font-size: 11px; color: rgba(255,255,255,0.8); }
  .result-desc {
    font-size: 14px;
    color: var(--gray-700);
    line-height: 1.8;
    margin-bottom: 20px;
  }
  .result-block {
    padding: 14px 16px;
    background: var(--gray-100);
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .result-block-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue-mid);
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .result-block-text {
    font-size: 14px;
    color: var(--gray-700);
    line-height: 1.75;
  }
  .result-cta-text {
    font-size: 14px;
    color: var(--gray-500);
    line-height: 1.7;
    padding: 14px 16px;
    border-left: 3px solid var(--pink);
    background: var(--pink-light);
    border-radius: 0 10px 10px 0;
    margin-bottom: 4px;
  }
  .btn-cta {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--pink), #FF9BB5);
    color: var(--white);
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
    box-shadow: 0 4px 20px rgba(255,123,154,0.30);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.3px;
  }
  .btn-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,123,154,0.40); }

  /* Loading */
  .loading-screen {
    text-align: center;
    padding: 60px 28px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid var(--gray-300);
    border-top-color: var(--blue-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; color: var(--gray-500); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen.active { animation: fadeUp 0.3s ease; }

  /* Level colors — 부드러운 톤 */
  .level-0 .level-badge { background: #FDECEA; color: #B91C1C; }
  .level-0 .score-circle { background: linear-gradient(135deg, #E57373, #C62828); }
  .level-1 .level-badge { background: #FEF3E2; color: #B45309; }
  .level-1 .score-circle { background: linear-gradient(135deg, #FFB74D, #E65100); }
  .level-2 .level-badge { background: #FFFBEB; color: #92400E; }
  .level-2 .score-circle { background: linear-gradient(135deg, #FFD54F, #F9A825); }
  .level-3 .level-badge { background: #F0FDF4; color: #166534; }
  .level-3 .score-circle { background: linear-gradient(135deg, #66BB6A, #2E7D32); }
  .level-4 .level-badge { background: #EFF6FF; color: #1E40AF; }
  .level-4 .score-circle { background: linear-gradient(135deg, #60A5FA, #1D4ED8); }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="brand">THE HABIT LAB</div>
    <div class="title">3분 대사 자가진단</div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-info">
      <span id="progressText">1 / 23</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <!-- Screen 1: Start -->
  <div class="screen active" id="screen-start">
    <p class="subtitle">내 몸의 대사 레벨을 확인해보세요.</p>
    <button class="btn-primary" onclick="goTo('screen-consent')">진단 시작하기</button>
    <p class="disclaimer">* 이 진단은 의학적 검사가 아닌, 더 해빗랩 다이어트 디자인 코칭에서 사용하는 대사 레벨 진단 도구입니다.</p>
  </div>

  <!-- Screen 2: Consent -->
  <div class="screen" id="screen-consent">
    <button class="btn-back" onclick="goTo('screen-start')">← 이전</button>
    <div class="question-part">개인정보 수집 동의</div>
    <p class="question-text">아래 정보 수집에 동의해 주세요.</p>
    <label class="consent-label">
      <input type="checkbox" id="consentCheck" onchange="checkConsent()">
      <div class="checkbox-custom"></div>
      <div>
        <div class="consent-text">개인정보 수집 및 이용에 동의합니다.</div>
        <div class="consent-detail">수집 항목: 이름, 전화번호<br>수집 목적: 더 해빗랩 다이어트 디자인 이벤트(무료 라이브 강의 및 무료 코칭) 안내</div>
      </div>
    </label>
    <button class="btn-primary" id="btnConsent" onclick="goTo('screen-info')" disabled>다음</button>
  </div>

  <!-- Screen 3: Info -->
  <div class="screen" id="screen-info">
    <button class="btn-back" onclick="goTo('screen-consent')">← 이전</button>
    <div class="question-part">기본 정보 입력</div>
    <div class="form-group">
      <label class="form-label">이름 *</label>
      <input class="form-input" type="text" id="inputName" placeholder="이름을 입력해 주세요">
    </div>
    <div class="form-group">
      <label class="form-label">전화번호 *</label>
      <input class="form-input" type="tel" id="inputPhone" placeholder="010-0000-0000">
    </div>
    <button class="btn-primary" onclick="startSurvey()" style="margin-top:8px">진단 시작하기</button>
  </div>

  <!-- Screen 4: Questions -->
  <div class="screen" id="screen-question">
    <button class="btn-back" onclick="prevQuestion()">← 이전</button>
    <div class="question-part" id="qPart"></div>
    <div class="question-text" id="qText"></div>
    <div class="options" id="qOptions"></div>
  </div>

  <!-- Loading -->
  <div class="screen" id="screen-loading">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">잠시만요,<br>결과를 분석하고 있어요...</div>
    </div>
  </div>

  <!-- Result -->
  <div class="screen" id="screen-result">
    <div class="result-level" id="resultLevel"></div>
    <div class="result-desc" id="resultDesc"></div>
    <!-- 2026-10-19: 결과를 보고 상담 없이 나가던 사람이 스스로 확인하도록 안내서(앱)로 잇는다 (2026-10-22 코치: 20분 무료 상담 안내는 지움) -->
    <a href="https://claude.center1124.workers.dev/guide" id="guideLink" class="btn-cta" onclick="trackFunnel('7_안내서클릭')">내 결과 안내서 보기</a>
    <p class="disclaimer" style="margin-top:16px">* 이 진단은 의학적 검사가 아닌, 더 해빗랩 다이어트 디자인 코칭에서 사용하는 대사 레벨 진단 도구입니다.</p>
  </div>
</div>

<script>
// ─── Google Apps Script URL ───
const GUIDE_URL = 'https://claude.center1124.workers.dev/guide';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxfz9LrWKZ_feDvi9j6puxwwAC_LTbd_U2hrjG7FC5HGegDuyu2wl5YcVcSXVoA7HCd/exec';

// ─── 퍼널 추적 ───
function trackFunnel(step, detail = '') {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') return;
  const data = {
    type: 'funnel',
    timestamp: new Date().toLocaleString('ko-KR'),
    step,
    detail,
    name: document.getElementById('inputName')?.value || '',
    phone: document.getElementById('inputPhone')?.value || '',
  };
  fetch(APPS_SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
}

// ─── 응답 저장 ───
let answers = {};
let currentQ = 0;

// ─── 설문 문항 ───
const questions = [
  {
    id: 'Q1', part: '파트 1  •  기본 정보 및 여성 호르몬',
    text: '몇 년생이신가요?',
    type: 'text', placeholder: '예: 1990',
    score: () => 0
  },
  {
    id: 'Q2', part: '파트 1  •  기본 정보 및 여성 호르몬',
    text: '현재 피임약 또는 체내 장치(미레나, 구리 루프 등)를 사용 중이신가요?',
    type: 'choice',
    options: ['아니오', '예'],
    score: (v) => 0 // 가중치 플래그만
  },
  {
    id: 'Q3', part: '파트 1  •  기본 정보 및 여성 호르몬',
    text: '현재 월경 상태를 선택해 주세요.',
    type: 'choice',
    options: ['규칙적임 (28일 기준 ±2~3일)', '불규칙함 (주기 예측 어려움)', '무월경 (가임기이나 수개월 멈춤)', '폐경(완경) 이후'],
    score: (v) => [0, 10, 15, 15][v]
  },
  {
    id: 'Q4', part: '파트 1  •  기본 정보 및 여성 호르몬',
    text: '평균 월경 주기는 며칠인가요?',
    type: 'choice',
    options: ['26~30일', '25일 이하', '31~35일', '36일 이상 또는 무월경', '폐경(완경)'],
    score: (v) => [0, 5, 5, 10, 10][v]
  },
  {
    id: 'Q5', part: '파트 1  •  기본 정보 및 여성 호르몬',
    text: '평균 월경 기간은 며칠인가요?',
    type: 'choice',
    options: ['5일 전후', '3일 이하', '7일 이상', '불규칙함', '해당 없음 (무월경/폐경)'],
    score: (v) => [0, 3, 3, 5, 0][v]
  },
  {
    id: 'Q6', part: '파트 1  •  기본 정보 및 여성 호르몬',
    text: '다낭성 난소 증후군(PCOS) 진단을 받은 적이 있나요?',
    type: 'choice',
    options: ['아니오', '예'],
    score: (v) => [0, 5][v]
  },
  {
    id: 'Q7', part: '파트 2  •  소화 및 배출 상태',
    text: '채소나 샐러드를 먹으면 소화가 안 되고 속이 더부룩하거나 겉도는 느낌이 든다.',
    type: 'scale',
    score: (v) => (v + 1) * 1.0
  },
  {
    id: 'Q8', part: '파트 2  •  소화 및 배출 상태',
    text: '클린한 식단보다 라면, 빵, 과자 같은 가공식품을 먹었을 때 속이 더 편하다.',
    type: 'scale',
    score: (v) => (v + 1) * 2.0
  },
  {
    id: 'Q9', part: '파트 2  •  소화 및 배출 상태',
    text: '기름진 음식을 먹거나 평소보다 과식을 하면 설사를 하는 경우가 자주 있다.',
    type: 'scale',
    score: (v) => (v + 1) * 2.0
  },
  {
    id: 'Q10', part: '파트 2  •  소화 및 배출 상태',
    text: '식사 후 배에 가스가 차서 아랫배가 빵빵해지는 증상이 자주 있다.',
    type: 'scale',
    score: (v) => (v + 1) * 0.5
  },
  {
    id: 'Q11', part: '파트 2  •  소화 및 배출 상태',

const scaleLabels = ['전혀 그렇지 않다', '그렇지 않다', '보통이다', '그렇다', '매우 그렇다'];

function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  const showProgress = screenId === 'screen-question';
  document.getElementById('progressWrap').classList.toggle('visible', showProgress);

  const stepMap = {
    'screen-start': '1_시작화면',
    'screen-consent': '2_동의화면',
    'screen-info': '3_정보입력',
    'screen-question': '4_설문진행',
    'screen-loading': '5_로딩',
    'screen-result': '6_결과확인'
  };
  if (stepMap[screenId]) trackFunnel(stepMap[screenId]);
}

function checkConsent() {
  document.getElementById('btnConsent').disabled = !document.getElementById('consentCheck').checked;
}

function startSurvey() {
  const name = document.getElementById('inputName').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();
  if (!name || !phone) { alert('모든 항목을 입력해 주세요.'); return; }
  currentQ = 0;
  renderQuestion();
  goTo('screen-question');
}

function renderQuestion() {
  const q = questions[currentQ];
  const total = questions.length;
  const pct = Math.round((currentQ / total) * 100);

  document.getElementById('progressText').textContent = `${currentQ + 1} / ${total}`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('qPart').textContent = q.part;
  document.getElementById('qText').textContent = q.text;

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';

  if (q.type === 'text') {
    const inp = document.createElement('input');
    inp.className = 'form-input year-input-wrap';
    inp.type = 'text';
    inp.placeholder = q.placeholder || '';
    inp.value = answers[q.id] !== undefined ? answers[q.id] : '';
    inp.style.marginBottom = '16px';
    optWrap.appendChild(inp);
    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = '다음';
    btn.onclick = () => {
      answers[q.id] = inp.value.trim();
      nextQuestion();
    };
    optWrap.appendChild(btn);
  } else if (q.type === 'choice') {
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn' + (answers[q.id] === i ? ' selected' : '');
      btn.textContent = opt;
      btn.onclick = () => {
        answers[q.id] = i;
        setTimeout(nextQuestion, 250);
      };
      optWrap.appendChild(btn);
    });
  } else if (q.type === 'scale') {
    scaleLabels.forEach((label, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn' + (answers[q.id] === i ? ' selected' : '');
      btn.textContent = `${['①','②','③','④','⑤'][i]}  ${label}`;
      btn.onclick = () => {
        answers[q.id] = i;
        setTimeout(nextQuestion, 250);
      };
      optWrap.appendChild(btn);
    });
  }
}

function nextQuestion() {
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
  else { goTo('screen-info'); }
}

// 페이지 이탈 시 설문 중단 위치 추적
window.addEventListener('beforeunload', () => {
  const screen = document.querySelector('.screen.active')?.id;
  if (screen === 'screen-question') {
    trackFunnel('이탈_설문중', `Q${currentQ + 1}에서 이탈`);
  }
});

function calcScore() {
  let raw = 0;
  const usesHormone = answers['Q2'] === 1;

  // 파트1
  const q3Score = (usesHormone) ? 5 : questions[2].score(answers['Q3'] ?? 0);
  const q4Score = (usesHormone || answers['Q3'] >= 2) ? 0 : questions[3].score(answers['Q4'] ?? 0);
  const q5Score = (usesHormone) ? 0 : questions[4].score(answers['Q5'] ?? 0);
  const q6Score = questions[5].score(answers['Q6'] ?? 0);
  raw += q3Score + q4Score + q5Score + q6Score;

  // 파트2
  let part2 = 0;
  for (let i = 6; i <= 10; i++) {
    part2 += questions[i].score(answers[questions[i].id] ?? 0);
  }
  if (usesHormone) part2 *= 1.2;
  raw += part2;

  // 파트3
  let part3 = 0;
  for (let i = 11; i <= 17; i++) {
    part3 += questions[i].score(answers[questions[i].id] ?? 0);
  }
  if (usesHormone) part3 *= 1.2;
  raw += part3;

  // 파트4
  for (let i = 18; i <= 22; i++) {
    raw += questions[i].score(answers[questions[i].id] ?? 0);
  }

  // 점수 반전: 높을수록 대사가 좋은 상태
  const inverted = Math.round(100 - raw);
  return Math.max(0, Math.min(100, inverted));
}

function showResult() {
  goTo('screen-loading');
  setTimeout(() => {
    const score = calcScore();
    const lv = getLevel(score);
    const resultEl = document.getElementById('resultLevel');
    resultEl.className = `result-level level-${lv.level}`;
    resultEl.innerHTML = `
      <div class="score-circle"><div class="score-number">${score}</div><div class="score-label">점</div></div>
      <div class="level-badge level-${lv.level}">Level ${lv.level}</div>
      <div class="level-name">${lv.name}</div>
      <div class="level-en">${lv.en}</div>
      <div class="result-summary">${lv.summary}</div>
    `;
    document.getElementById('resultDesc').innerHTML = `
      <div class="result-block">
        <div class="result-block-title">📊 현재 상태</div>
        <div class="result-block-text">${lv.severity}</div>
      </div>
      <div class="result-block">
        <div class="result-block-title">🔍 지금 몸에서 일어나고 있는 일</div>
        <div class="result-block-text">${lv.body}</div>
      </div>
      <div class="result-block">
        <div class="result-block-title">✅ 지금 당장 해야 할 것</div>
        <div class="result-block-text">${lv.action}</div>
      </div>
      <div class="result-cta-text">${lv.cta}</div>
    `;
    // 안내서로 넘길 때는 단계 번호만 싣는다 (이름·전화번호는 주소에 넣지 않는다)
    document.getElementById('guideLink').href = GUIDE_URL + '?level=' + lv.level;
    goTo('screen-result');
    sendToSheets(score, lv);
  }, 1800);
}

function sendToSheets(score, lv) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') return;
  const data = {
    timestamp: new Date().toLocaleString('ko-KR'),
    name: document.getElementById('inputName').value,
    phone: document.getElementById('inputPhone').value,
    score: score,
    level: `Level ${lv.level} - ${lv.name}`,
    ...Object.fromEntries(questions.map(q => [q.id, answers[q.id] ?? '']))
  };
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
}
